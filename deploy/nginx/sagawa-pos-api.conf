# Nginx reverse proxy for Sagawa POS API.
# Place this file in /etc/nginx/sites-available/sagawa-pos-api.conf,
# then symlink it to /etc/nginx/sites-enabled/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream sagawa_pos_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-pos.sagawagroup.id;

    client_max_body_size 20m;

    location / {
        proxy_pass http://sagawa_pos_api;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}

